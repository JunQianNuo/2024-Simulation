# Q1-A1 候选网格与代表性参数集
# 依据：B题阶段3算法设计报告 §4.3
# 本文件是"预先声明的有限候选网格"，运行前冻结，不在看到结果后回改。

problem:
  p0: 0.10          # 标称次品率
  alpha_R: 0.05     # 拒收错误预算 -> 95% 信度 (Q1-C1)
  alpha_A: 0.10     # 接收错误预算 -> 90% 信度 (Q1-C2)

grid:
  t_opt:  [25, 50, 100, 200, 400, 800, 1600]
  n_max:  [50, 100, 200, 400, 800, 1600, 3200]
  # 约束 n_max >= t_opt，删去不合法组合后应为 34 个候选
  expected_candidates: 34

# 代表性真实次品率集合 P：阈值附近加密，不指定"好/坏"无差异区
representative_p: [0.01, 0.03, 0.05, 0.07, 0.08, 0.09, 0.10,
                   0.11, 0.12, 0.13, 0.15, 0.20, 0.30]

# 权重方案。主报告用 equal，其余两个做敏感性。
# 权重只决定 Pareto 方案排序，不改变 CS 的错误保证。
weight_schemes:
  equal:        null            # null 表示等权
  near_threshold:  [0.02, 0.02, 0.03, 0.08, 0.12, 0.15, 0.16,
                    0.15, 0.12, 0.08, 0.04, 0.02, 0.01]
  far_threshold:   [0.14, 0.13, 0.12, 0.05, 0.03, 0.02, 0.02,
                    0.02, 0.03, 0.05, 0.09, 0.13, 0.17]

tolerances:
  prob_conservation: 1.0e-10    # 接收+拒收+未决 = 1 的容差
  cs_crosscheck:     1.0e-08    # 两套独立实现的端点差容差
  root_tol:          1.0e-12    # 边界根求解容差
  dp_prune:          1.0e-18    # DP 质量剪枝阈值（远严于守恒容差）

reproducibility:
  numpy_seed: null              # Q1 全程确定性，不使用随机数
